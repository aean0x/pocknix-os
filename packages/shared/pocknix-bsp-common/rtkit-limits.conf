[Service]
# Stock rtkit clamps PipeWire's RR 88 to 20, under display FIFO 50; 80 sits it beside the audio irq
# threads, below GPU/display. No --no-polkit: Arch's rtkit lacks it and exits.
ExecStart=
ExecStart=/usr/lib/rtkit-daemon --our-realtime-priority=81 --max-realtime-priority=80 --threads-per-user-max=200 --actions-per-burst-max=1000
