# pocknix RetroArch defaults, copied once by pocknix-roms-init when the user has no config.
# RetroArch supplies every unset key itself, so keep this to what "just works" requires.

# One drop point for BIOS/saves/states; ~ is expanded to the deck home by RetroArch.
system_directory = "~/Emulation/BIOS"

savefile_directory = "~/Emulation/Saves"
savestate_directory = "~/Emulation/States"
sort_savefiles_enable = "true"
sort_savestates_enable = "true"

# Turnip is the fast path; a core that misbehaves on vulkan gets a per-core override, not a
# global flip (GL-only cores fall back to freedreno regardless).
video_driver = "vulkan"
video_fullscreen = "true"
video_vsync = "true"
# 120Hz values: swap_interval an EXPLICIT 2 (0/auto paces worse), max_swapchain_images 2 (3 adds
# slack under gamescope). roms-init rewrites both per device from POCKNIX_PANEL_REFRESH.
video_refresh_rate = "120.000000"
video_swap_interval = "2"
video_max_swapchain_images = "2"

# Autodetect is load-bearing: bindings come from retroarch-autoconfig-pocknix, and with no
# profile for the pad in play the controls are entirely dead.
menu_driver = "ozone"
input_autodetect_enable = "true"
menu_swap_ok_cancel_buttons = "false"
# L1+R1+Start+Select toggles the menu (combo 2; L3+R3 would be 1): device-independent and no
# game claims it.
input_menu_toggle_gamepad_combo = "2"

# Mode 1 (non-forced) makes the left stick double as the D-pad on digital-only systems while
# reverting to analog for cores that request it. Set for all 4 players so BT pads match.
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"
input_player3_analog_dpad_mode = "1"
input_player4_analog_dpad_mode = "1"

rewind_enable = "false"

# Upstream ships an empty aarch64 buildbot URL and an info path holding no .info files, so the
# Core Downloader lists nothing. /etc/retroarch.cfg is ignored once this file exists.
core_updater_buildbot_cores_url = "https://buildbot.libretro.com/nightly/linux/aarch64/latest/"
libretro_info_path = "/usr/share/libretro/info"
