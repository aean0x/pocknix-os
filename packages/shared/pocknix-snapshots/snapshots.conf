# pocknix-snapshots tunables — sourced by /usr/lib/pocknix/snapshot-lib.sh
# (pacman backup= file: your edits survive package updates)

# pre-update snapshots to retain (pruned after each update + rollback). An update takes
# one, so 2 = the state before the last update and before the one prior.
POCKNIX_SNAPSHOT_KEEP=2

# below this much free space (MiB) the pre-update snapshot is SKIPPED — the
# update itself always proceeds
POCKNIX_SNAPSHOT_MIN_FREE_MIB=1024

# below this much free space (MiB) the Pocknix Control UI shows a warning
POCKNIX_SNAPSHOT_WARN_FREE_MIB=5120
