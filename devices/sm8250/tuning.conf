# Userspace compiler tuning for this chip. POSIX sh, sourced by scripts/lib.sh
# after the profile; build-packages.sh passes the values into makepkg's
# environment for the packages/soc and packages/gpu PKGBUILDs (never packages/shared).
#
# The Snapdragon 865 is 4x A77 + 4x A55 (armv8.2, no SVE/armv9); gcc has no
# a77.a55 big.LITTLE tune pair, so the adjacent a76.a55 pair is used.
: "${POCKNIX_TUNE_CFLAGS:=-march=armv8.2-a+crypto+crc+fp+simd -mtune=cortex-a76.cortex-a55 -mno-outline-atomics}"
