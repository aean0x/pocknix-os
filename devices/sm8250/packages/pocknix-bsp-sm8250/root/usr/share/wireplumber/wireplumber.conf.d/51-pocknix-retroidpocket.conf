# pocknix (sm8250): every PCM on the RetroidPocket card opens 16-bit. The q6asm path
# plays a 24-bit stream about 48 dB down (8 bits), and PipeWire picks S24_LE whenever
# the PCM offers it.
monitor.alsa.rules = [
  {
    matches = [
      { alsa.card_name = "RetroidPocket" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
