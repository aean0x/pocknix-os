# The DSP never answers a 24-bit start on the DP port (3 s timeout, then no sound),
# so the UCM DisplayPort sink is pinned to S16LE. It shares hw:RetroidPocket,1 with
# the speaker, hence the match on the sink's node name rather than the PCM path.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.platform-sound.HiFi__DisplayPort__sink"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        api.alsa.disable-mmap = true
        api.alsa.period-size = 480
        api.alsa.period-num = 8
      }
    }
  }
]
