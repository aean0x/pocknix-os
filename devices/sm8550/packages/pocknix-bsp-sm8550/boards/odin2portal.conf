# /usr/lib/pocknix/boards/odin2portal.conf: AYN Odin 2 Portal, on top of boards/family.conf.
. /usr/lib/pocknix/boards/family.conf
POCKNIX_DEVICE=odin2portal

# chipone,icna3512, native 1080x1920@120 portrait, DTS rotation=270 -> landscape (as the RP6,
# token left). The driver also carries a 60Hz mode.
POCKNIX_PANEL_W=1080
POCKNIX_PANEL_H=1920
POCKNIX_PANEL_REFRESH=120
POCKNIX_PANEL_ORIENT=left        # gamescope --force-orientation
POCKNIX_DESKTOP_ROTATE=left      # kscreen-doctor rotation token
POCKNIX_DESKTOP_SCALE=2.5
